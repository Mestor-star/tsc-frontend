<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>终末停滞委员会 · 低语者终端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08080f;
      font-family: 'Segoe UI', 'Noto Sans SC', system-ui, sans-serif;
      color: #d0d0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .terminal {
      max-width: 880px;
      width: 100%;
      background: linear-gradient(145deg, #0e0e1a 0%, #12121f 100%);
      border: 1px solid #2a2a44;
      border-radius: 20px;
      padding: 20px 24px 24px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.8), inset 0 0 60px rgba(60,40,120,0.05);
    }
    .terminal::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #6a4aff, #a78bfa, #6a4aff, transparent);
      opacity: 0.6;
    }
    .terminal { position: relative; }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 14px 4px;
      border-bottom: 1px solid #1e1e32;
      margin-bottom: 16px;
      gap: 6px 16px;
    }
    .top-bar .r-value {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      background: #12121f;
      padding: 4px 14px 4px 12px;
      border-radius: 20px;
      border: 1px solid #2a2a44;
    }
    .top-bar .r-value .num { color: #a78bfa; font-family: 'Courier New', monospace; font-size: 16px; }
    .top-bar .r-value .label { color: #6a6a8a; font-weight: 400; }
    .top-bar .info-group { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: #8a8aaa; }
    .top-bar .info-group .val { color: #e0e0f0; font-weight: 500; }
    .page-container { min-height: 200px; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
      background: #10101c;
      border-radius: 12px;
      padding: 16px 20px;
      border: 1px solid #1e1e34;
    }
    .profile-grid .item .tag { font-size: 11px; color: #5a5a7a; text-transform: uppercase; letter-spacing: 0.5px; }
    .profile-grid .item .value { font-size: 15px; font-weight: 500; color: #e8e8f8; }
    .profile-grid .item .value .highlight { color: #a78bfa; }
    .profile-grid .full { grid-column: 1 / -1; }
    .profile-grid .desc { font-size: 13px; color: #9a9aba; line-height: 1.6; padding-top: 2px; }
    .whisper-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .whisper-list::-webkit-scrollbar { width: 4px; }
    .whisper-list::-webkit-scrollbar-track { background: #12121f; }
    .whisper-list::-webkit-scrollbar-thumb { background: #2e2e4a; border-radius: 4px; }
    .whisper-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0e0e1a;
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      padding: 8px 12px;
      transition: 0.2s;
    }
    .whisper-item:hover { background: #16162a; border-color: #2e2e4e; }
    .whisper-item .icon { font-size: 18px; width: 28px; text-align: center; flex-shrink: 0; }
    .whisper-item .info { flex: 1; min-width: 0; }
    .whisper-item .info .name { font-size: 14px; font-weight: 500; color: #e0e0f0; }
    .whisper-item .info .sub { font-size: 12px; color: #6a6a8a; display: flex; gap: 10px; flex-wrap: wrap; }
    .whisper-item .thought-preview { font-size: 12px; color: #8a8aaa; flex: 1; text-align: right; }
    .loading-text { color: #4a4a6a; text-align: center; padding: 20px 0; font-size: 14px; }
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid #1a1a2e;
      margin-top: 12px;
    }
    .nav-bar button {
      background: transparent;
      border: 1px solid #2a2a44;
      color: #8a8aaa;
      padding: 6px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .nav-bar button:hover { background: #1a1a2e; border-color: #4a4a6a; color: #d0d0e8; }
    .nav-bar button.active { background: #2a2a4a; border-color: #6a4aff; color: #d0d0e8; }
    .nav-bar .page-indicator { color: #4a4a6a; font-size: 13px; padding: 6px 12px; }
    .footer-hint { text-align: center; font-size: 12px; color: #3a3a5a; padding-top: 12px; user-select: none; }
    @media (max-width: 520px) { .profile-grid { grid-template-columns: 1fr; } .terminal { padding: 14px; } }
  </style>
</head>
<body>

<div class="terminal">
  <!-- 状态栏 -->
  <div class="top-bar">
    <div class="r-value">
      <span class="label">R值</span>
      <span class="num" id="rValue">1.000</span>
    </div>
    <div class="info-group">
      <span>📍 <span class="val" id="locDisplay">太平洋 · 运输船</span></span>
      <span>⏳ <span class="val" id="timeDisplay">午后</span></span>
    </div>
  </div>

  <!-- 页面 -->
  <div class="page-container">
    <!-- 页面一：主角 -->
    <div class="page active" id="page-profile">
      <div class="profile-grid">
        <div class="item"><span class="tag">姓名</span><span class="value" id="charName">{{user}}</span></div>
        <div class="item"><span class="tag">终末</span><span class="value highlight" id="charTerminal">低语者</span></div>
        <div class="item"><span class="tag">Stage</span><span class="value" id="charStage">4 · 活性化</span></div>
        <div class="item"><span class="tag">状态</span><span class="value" id="charStatus">疲惫 · 警惕</span></div>
        <div class="item full"><span class="tag">武器</span><span class="value" id="charWeapon">noapusa（已损毁）</span></div>
        <div class="item full"><span class="tag">低语者 · 感知</span><span class="desc" id="charPerception">等待扫描...</span></div>
      </div>
    </div>

    <!-- 页面二：低语者 -->
    <div class="page" id="page-whisper">
      <div class="whisper-list" id="whisperList">
        <div class="loading-text">🔮 点击「扫描」探测周围的心声</div>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="nav-bar">
    <button class="active" data-page="profile">📋 主角</button>
    <button data-page="whisper">🔮 低语者</button>
    <span class="page-indicator" id="pageIndicator">1 / 2</span>
    <button id="scanBtn" style="border-color:#4a3a6a;color:#b8b8e0;">⟳ 扫描</button>
  </div>

  <div class="footer-hint">✦ 终末停滞委员会 · 第12区终端 ✦</div>
</div>

<script>
  // ============================================================
  //  页面切换
  // ============================================================
  const pages = {
    profile: document.getElementById('page-profile'),
    whisper: document.getElementById('page-whisper')
  };
  const navBtns = document.querySelectorAll('.nav-bar button[data-page]');
  const indicator = document.getElementById('pageIndicator');

  navBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      navBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      Object.keys(pages).forEach(k => {
        pages[k].classList.toggle('active', k === this.dataset.page);
      });
      const total = Object.keys(pages).length;
      const current = Object.keys(pages).indexOf(this.dataset.page) + 1;
      indicator.textContent = current + ' / ' + total;
    });
  });

  // ============================================================
  //  发送消息到酒馆
  // ============================================================
  function sendToTavern(text) {
    if (window.parent && window.parent.postMessage) {
      window.parent.postMessage({ type: 'sendMessage', text: text }, '*');
    } else {
      // 降级方案：填入输入框
      const input = document.querySelector('textarea');
      if (input) {
        input.value = text;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        const sendBtn = document.querySelector('button[type="submit"]');
        if (sendBtn) sendBtn.click();
      }
    }
  }

  // ============================================================
  //  扫描按钮
  // ============================================================
  const scanBtn = document.getElementById('scanBtn');
  scanBtn.addEventListener('click', function() {
    this.textContent = '⏳ 扫描中...';
    sendToTavern('[低语者] 扫描周围环境');
    setTimeout(() => { this.textContent = '⟳ 扫描'; }, 3000);
  });

  // ============================================================
  //  接收酒馆回复
  // ============================================================
  const els = {
    rValue: document.getElementById('rValue'),
    loc: document.getElementById('locDisplay'),
    time: document.getElementById('timeDisplay'),
    name: document.getElementById('charName'),
    terminal: document.getElementById('charTerminal'),
    stage: document.getElementById('charStage'),
    status: document.getElementById('charStatus'),
    weapon: document.getElementById('charWeapon'),
    perception: document.getElementById('charPerception'),
    whisperList: document.getElementById('whisperList')
  };

  window.addEventListener('message', function(event) {
    const data = event.data;
    if (data.type === 'updateStory') {
      try {
        const parsed = JSON.parse(data.content);
        if (parsed.rValue !== undefined) els.rValue.textContent = parsed.rValue.toFixed(3);
        if (parsed.location) els.loc.textContent = parsed.location;
        if (parsed.time) els.time.textContent = parsed.time;
        if (parsed.name) els.name.textContent = parsed.name;
        if (parsed.terminal) els.terminal.textContent = parsed.terminal;
        if (parsed.stage) els.stage.textContent = parsed.stage;
        if (parsed.status) els.status.textContent = parsed.status;
        if (parsed.weapon) els.weapon.textContent = parsed.weapon;
        if (parsed.perception) els.perception.textContent = parsed.perception;
        if (parsed.whispers) {
          const list = els.whisperList;
          if (parsed.whispers.length === 0) {
            list.innerHTML = '<div class="loading-text">🔇 周围没有可感知的存在</div>';
          } else {
            list.innerHTML = parsed.whispers.map(w =>
              `<div class="whisper-item">
                <span class="icon">${w.icon || '👤'}</span>
                <div class="info">
                  <div class="name">${w.name}</div>
                  <div class="sub">${w.type || '存在'} · 距离 ${w.distance || '?'}</div>
                </div>
                <span class="thought-preview">${w.thought ? '「' + w.thought.slice(0, 12) + (w.thought.length > 12 ? '…」' : '」') : '…'}</span>
              </div>`
            ).join('');
          }
        }
      } catch(e) {
        // 不是JSON，忽略
      }
    }
  });

  // ============================================================
  //  向酒馆请求初始内容
  // ============================================================
  setTimeout(() => {
    if (window.parent && window.parent.postMessage) {
      window.parent.postMessage({ type: 'requestFirstMessage' }, '*');
    }
  }, 500);

  console.log('✅ 低语者终端已启动');
</script>
</body>
</html>
