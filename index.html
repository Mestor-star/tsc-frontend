<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>终末停滞委员会 · 低语者终端</title>
  <style>
    /* ===== 全局重置 & 字体 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&display=swap');

    body {
      background: #08080f;
      font-family: 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
      color: #d0d0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* ===== 主容器 ===== */
    .terminal {
      max-width: 960px;
      width: 100%;
      background: linear-gradient(145deg, #0e0e1a 0%, #12121f 100%);
      border: 1px solid #2a2a44;
      border-radius: 20px;
      padding: 20px 24px 24px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8), inset 0 0 60px rgba(60, 40, 120, 0.05);
      position: relative;
    }

    /* 装饰性顶部光效 */
    .terminal::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #6a4aff, #a78bfa, #6a4aff, transparent);
      opacity: 0.6;
    }

    /* ===== 顶栏：R值 + 时间 + 地点 ===== */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 14px 4px;
      border-bottom: 1px solid #1e1e32;
      margin-bottom: 16px;
      gap: 6px 16px;
    }

    .top-bar .r-value {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: #12121f;
      padding: 4px 14px 4px 12px;
      border-radius: 20px;
      border: 1px solid #2a2a44;
    }
    .top-bar .r-value .num {
      color: #a78bfa;
      font-family: 'Courier New', monospace;
      font-size: 16px;
    }
    .top-bar .r-value .label {
      color: #6a6a8a;
      font-weight: 400;
    }
    .top-bar .r-value .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 2px;
    }
    .top-bar .r-value .status-dot.stable { background: #4ade80; }
    .top-bar .r-value .status-dot.warning { background: #fbbf24; }
    .top-bar .r-value .status-dot.danger { background: #f87171; }
    .top-bar .r-value .status-dot.critical { background: #ef4444; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .top-bar .info-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      font-size: 13px;
      color: #8a8aaa;
    }
    .top-bar .info-group span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .top-bar .info-group .val {
      color: #e0e0f0;
      font-weight: 500;
    }

    /* ===== 主内容区 ===== */
    .main-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 340px;
    }

    /* ===== 页面容器 ===== */
    .page-container {
      flex: 1;
      min-height: 260px;
      position: relative;
    }

    .page {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 页面一：主角信息 ===== */
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 24px;
      background: #10101c;
      border-radius: 12px;
      padding: 18px 22px;
      border: 1px solid #1e1e34;
    }
    @media (max-width: 520px) {
      .profile-grid { grid-template-columns: 1fr; gap: 8px; }
    }

    .profile-grid .item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .profile-grid .item .tag {
      font-size: 11px;
      color: #5a5a7a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .profile-grid .item .value {
      font-size: 15px;
      font-weight: 500;
      color: #e8e8f8;
    }
    .profile-grid .item .value .highlight {
      color: #a78bfa;
    }
    .profile-grid .item .value .danger {
      color: #f87171;
    }
    .profile-grid .item .value .warn {
      color: #fbbf24;
    }

    .profile-grid .full {
      grid-column: 1 / -1;
    }

    .profile-grid .desc {
      font-size: 13px;
      color: #9a9aba;
      line-height: 1.7;
      padding-top: 4px;
    }

    /* ===== 页面二：低语者界面 ===== */
    .whisper-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 10px 4px;
      border-bottom: 1px solid #1a1a2e;
      margin-bottom: 12px;
    }
    .whisper-header .title {
      font-size: 15px;
      font-weight: 600;
      color: #b8b8e0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .whisper-header .title .badge {
      font-size: 11px;
      background: #1e1e36;
      color: #8a8aaa;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 400;
    }
    .whisper-header .scan-btn {
      background: #1a1a30;
      border: 1px solid #2e2e4a;
      color: #a0a0c0;
      padding: 4px 16px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .whisper-header .scan-btn:hover {
      background: #282848;
      border-color: #4a4a6a;
    }

    /* 低语者列表 */
    .whisper-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .whisper-list::-webkit-scrollbar {
      width: 4px;
    }
    .whisper-list::-webkit-scrollbar-track {
      background: #12121f;
    }
    .whisper-list::-webkit-scrollbar-thumb {
      background: #2e2e4a;
      border-radius: 4px;
    }

    .whisper-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0e0e1a;
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .whisper-item:hover {
      background: #16162a;
      border-color: #2e2e4e;
    }
    .whisper-item .icon {
      font-size: 20px;
      width: 32px;
      text-align: center;
      flex-shrink: 0;
    }
    .whisper-item .info {
      flex: 1;
      min-width: 0;
    }
    .whisper-item .info .name {
      font-size: 14px;
      font-weight: 500;
      color: #e0e0f0;
    }
    .whisper-item .info .sub {
      font-size: 12px;
      color: #6a6a8a;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .whisper-item .info .sub .tag-type {
      background: #1a1a2e;
      padding: 0 8px;
      border-radius: 10px;
      font-size: 10px;
      color: #8a8aaa;
    }
    .whisper-item .status-indicator {
      font-size: 12px;
      flex-shrink: 0;
      padding: 2px 10px;
      border-radius: 12px;
      background: #1a1a2e;
      color: #6a6a8a;
      font-weight: 400;
    }
    .whisper-item .status-indicator.readable {
      color: #6ee7b7;
      background: #0e2a1e;
    }
    .whisper-item .status-indicator.unreadable {
      color: #f87171;
      background: #2a1414;
    }
    .whisper-item .status-indicator.overwhelming {
      color: #fbbf24;
      background: #2a2214;
    }

    /* ===== 心声详情弹窗 ===== */
    .thought-detail {
      display: none;
      background: #0a0a16;
      border: 1px solid #2a2a44;
      border-radius: 10px;
      padding: 14px 18px;
      margin-top: 10px;
      transition: 0.2s;
    }
    .thought-detail.open {
      display: block;
    }
    .thought-detail .thought-label {
      font-size: 11px;
      color: #5a5a7a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .thought-detail .thought-content {
      font-size: 14px;
      color: #c8c8e0;
      line-height: 1.8;
      font-style: italic;
      border-left: 2px solid #4a3a6a;
      padding-left: 14px;
    }
    .thought-detail .thought-content .empty {
      color: #5a5a7a;
      font-style: normal;
    }

    /* ===== 底部翻页导航 ===== */
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid #1a1a2e;
      margin-top: 4px;
    }
    .nav-bar button {
      background: transparent;
      border: 1px solid #2a2a44;
      color: #8a8aaa;
      padding: 6px 20px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .nav-bar button:hover {
      background: #1a1a2e;
      border-color: #4a4a6a;
      color: #d0d0e8;
    }
    .nav-bar button.active {
      background: #2a2a4a;
      border-color: #6a4aff;
      color: #d0d0e8;
    }
    .nav-bar .page-indicator {
      color: #4a4a6a;
      font-size: 13px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
    }

    /* ===== 底部提示 ===== */
    .footer-hint {
      text-align: center;
      font-size: 12px;
      color: #3a3a5a;
      padding-top: 12px;
      letter-spacing: 0.5px;
      user-select: none;
    }

    /* ===== 加载状态 ===== */
    .loading-text {
      color: #4a4a6a;
      text-align: center;
      padding: 30px 0;
      font-size: 14px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      .terminal { padding: 14px 14px 18px; }
      .top-bar { flex-direction: column; align-items: stretch; gap: 6px; }
      .top-bar .info-group { font-size: 12px; gap: 4px 12px; }
      .profile-grid { padding: 14px; gap: 8px; }
      .profile-grid .item .value { font-size: 14px; }
      .whisper-item { padding: 8px 10px; flex-wrap: wrap; }
      .whisper-item .info .sub { font-size: 11px; gap: 6px; }
      .nav-bar button { padding: 4px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="terminal" id="app">

  <!-- ===== 顶栏 ===== -->
  <div class="top-bar">
    <div class="r-value">
      <span class="label">R值</span>
      <span class="num" id="rValue">1.000</span>
      <span class="status-dot stable" id="rDot"></span>
      <span style="font-weight:400;color:#5a5a7a;font-size:12px;" id="rStatus">安定</span>
    </div>
    <div class="info-group">
      <span>📍 <span class="val" id="locDisplay">太平洋 · 运输船</span></span>
      <span>⏳ <span class="val" id="timeDisplay">午后</span></span>
      <span>📋 <span class="val" id="threatDisplay">低</span></span>
    </div>
  </div>

  <!-- ===== 主内容 ===== -->
  <div class="main-area">

    <!-- 页面容器 -->
    <div class="page-container">

      <!-- ===== 页面1：主角信息 ===== -->
      <div class="page active" id="page-profile">
        <div class="profile-grid">
          <div class="item">
            <span class="tag">代号 / 姓名</span>
            <span class="value" id="charName">言万心叶</span>
          </div>
          <div class="item">
            <span class="tag">年龄</span>
            <span class="value" id="charAge">17</span>
          </div>
          <div class="item">
            <span class="tag">终末</span>
            <span class="value highlight" id="charTerminal">低语者</span>
          </div>
          <div class="item">
            <span class="tag">Stage</span>
            <span class="value" id="charStage">4 · 活性化</span>
          </div>
          <div class="item full">
            <span class="tag">当前状态</span>
            <span class="value" id="charStatus">疲惫 · 警惕</span>
          </div>
          <div class="item full">
            <span class="tag">弹痕 / 斩击</span>
            <span class="value" id="charWeapon">noapusa（已损毁）</span>
          </div>
          <div class="item full">
            <span class="tag">低语者 · 当前感知</span>
            <span class="desc" id="charPerception">正在探测周围的心声...</span>
          </div>
        </div>
      </div>

      <!-- ===== 页面2：低语者 ===== -->
      <div class="page" id="page-whisper">
        <div class="whisper-header">
          <div class="title">
            🔮 低语者
            <span class="badge" id="whisperCount">0 个信号</span>
          </div>
          <button class="scan-btn" id="scanBtn">⟳ 扫描</button>
        </div>

        <!-- 列表 -->
        <div class="whisper-list" id="whisperList">
          <div class="loading-text">正在倾听...</div>
        </div>

        <!-- 心声详情 -->
        <div class="thought-detail" id="thoughtDetail">
          <div class="thought-label">📖 心声</div>
          <div class="thought-content" id="thoughtContent">
            <span class="empty">点击列表中的目标查看</span>
          </div>
        </div>
      </div>

    </div>

    <!-- ===== 底部导航 ===== -->
    <div class="nav-bar">
      <button class="active" data-page="profile">📋 主角</button>
      <button data-page="whisper">🔮 低语者</button>
      <span class="page-indicator" id="pageIndicator">1 / 2</span>
    </div>

  </div>

  <div class="footer-hint">✦ 终末停滞委员会 · 第12区终端 ✦</div>
</div>

<script>
  // =============================================================
  //  配  置
  // =============================================================
  const TRIGGER = '<TSCApp/>';

  // =============================================================
  //  状  态
  // =============================================================
  const state = {
    // R值
    rValue: 1.000,
    rStatus: '安定',

    // 地点 / 时间 / 威胁
    location: '太平洋 · 运输船',
    time: '午后',
    threat: '低',

    // 主角信息
    name: '言万心叶',
    age: 17,
    terminal: '低语者',
    stage: '4 · 活性化',
    status: '疲惫 · 警惕',
    weapon: 'noapusa（已损毁）',
    perception: '正在探测周围的心声...',

    // 低语者列表
    whispers: [],

    // 当前选中的目标
    selectedWhisper: null
  };

  // 预设的低语者数据（用于演示，实际由AI更新）
  const DEMO_WHISPERS = [
    { id: 'w1', name: '露娜', type: '人型', distance: '3m', readable: true, thought: '这孩子……总算醒过来了。' },
    { id: 'w2', name: '拉斐尔·加西亚', type: '人型', distance: '12m', readable: true, thought: '对不起……心叶……我本该保护你的。' },
    { id: 'w3', name: '黑之魔王', type: '终末', distance: '0m', readable: false, thought: '（无法读取——信息干扰过强）' },
    { id: 'w4', name: '水手（甲板）', type: '人型', distance: '8m', readable: true, thought: '离那个小鬼远点……' },
    { id: 'w5', name: '拉法叔叔', type: '人型', distance: '20m', readable: true, thought: '处理掉那个祸害……别留后患。' }
  ];

  // =============================================================
  //  DOM 引用
  // =============================================================
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  const rValueEl = $('#rValue');
  const rDotEl = $('#rDot');
  const rStatusEl = $('#rStatus');
  const locEl = $('#locDisplay');
  const timeEl = $('#timeDisplay');
  const threatEl = $('#threatDisplay');

  const nameEl = $('#charName');
  const ageEl = $('#charAge');
  const terminalEl = $('#charTerminal');
  const stageEl = $('#charStage');
  const statusEl = $('#charStatus');
  const weaponEl = $('#charWeapon');
  const perceptionEl = $('#charPerception');

  const whisperListEl = $('#whisperList');
  const whisperCountEl = $('#whisperCount');
  const thoughtDetailEl = $('#thoughtDetail');
  const thoughtContentEl = $('#thoughtContent');

  const pages = {
    profile: $('#page-profile'),
    whisper: $('#page-whisper')
  };
  const navBtns = $$('.nav-bar button');
  const pageIndicator = $('#pageIndicator');

  // =============================================================
  //  更新 UI
  // =============================================================
  function updateUI(data) {
    if (!data) return;

    // ---- 顶栏 ----
    if (data.rValue !== undefined) {
      state.rValue = data.rValue;
      rValueEl.textContent = data.rValue.toFixed(3);
      updateRDot(data.rValue);
    }
    if (data.rStatus) { state.rStatus = data.rStatus; rStatusEl.textContent = data.rStatus; }
    if (data.location) { state.location = data.location; locEl.textContent = data.location; }
    if (data.time) { state.time = data.time; timeEl.textContent = data.time; }
    if (data.threat) { state.threat = data.threat; threatEl.textContent = data.threat; }

    // ---- 主角信息 ----
    if (data.name) { state.name = data.name; nameEl.textContent = data.name; }
    if (data.age) { state.age = data.age; ageEl.textContent = data.age; }
    if (data.terminal) { state.terminal = data.terminal; terminalEl.textContent = data.terminal; }
    if (data.stage) { state.stage = data.stage; stageEl.textContent = data.stage; }
    if (data.status) { state.status = data.status; statusEl.textContent = data.status; }
    if (data.weapon) { state.weapon = data.weapon; weaponEl.textContent = data.weapon; }
    if (data.perception) { state.perception = data.perception; perceptionEl.textContent = data.perception; }

    // ---- 低语者列表 ----
    if (data.whispers) {
      state.whispers = data.whispers;
      renderWhispers(data.whispers);
    }

    // ---- 低语者选中 ----
    if (data.selectedWhisper !== undefined) {
      state.selectedWhisper = data.selectedWhisper;
      updateThoughtDetail(data.selectedWhisper);
    }
  }

  // ---- R值指示器 ----
  function updateRDot(val) {
    rDotEl.className = 'status-dot';
    if (val >= 0.98 && val <= 1.02) {
      rDotEl.classList.add('stable');
    } else if (val > 1.02 && val <= 1.10) {
      rDotEl.classList.add('warning');
    } else if (val > 1.10 && val <= 1.30) {
      rDotEl.classList.add('danger');
    } else if (val > 1.30 || val < 0.95) {
      rDotEl.classList.add('critical');
    } else {
      rDotEl.classList.add('stable');
    }
  }

  // ---- 渲染低语者列表 ----
  function renderWhispers(whispers) {
    if (!whispers || whispers.length === 0) {
      whisperListEl.innerHTML = '<div class="loading-text">🔇 周围没有可感知的存在</div>';
      whisperCountEl.textContent = '0 个信号';
      return;
    }

    whisperCountEl.textContent = whispers.length + ' 个信号';

    let html = '';
    whispers.forEach((w, idx) => {
      const statusClass = w.readable ? 'readable' : (w.readable === false ? 'unreadable' : 'overwhelming');
      const statusLabel = w.readable ? '可读' : (w.readable === false ? '不可读' : '混沌');

      html += `
        <div class="whisper-item" data-index="${idx}">
          <span class="icon">${w.icon || '👤'}</span>
          <div class="info">
            <div class="name">${w.name}</div>
            <div class="sub">
              <span>${w.type || '未知'}</span>
              <span>距离 ${w.distance || '?'}</span>
              <span class="tag-type">${w.tag || '存在'}</span>
            </div>
          </div>
          <span class="status-indicator ${statusClass}">${statusLabel}</span>
        </div>
      `;
    });

    whisperListEl.innerHTML = html;

    // 绑定点击事件
    whisperListEl.querySelectorAll('.whisper-item').forEach(el => {
      el.addEventListener('click', function () {
        const idx = parseInt(this.dataset.index);
        const target = whispers[idx];
        if (target) {
          state.selectedWhisper = target;
          updateThoughtDetail(target);
          // 发送选择到酒馆
          sendWhisperSelect(target);
        }
      });
    });
  }

  // ---- 更新心声详情 ----
  function updateThoughtDetail(target) {
    if (!target) {
      thoughtDetailEl.classList.remove('open');
      return;
    }
    thoughtDetailEl.classList.add('open');

    const name = target.name || '未知';
    const thought = target.thought || '（沉默）';
    const readable = target.readable;

    let content = '';
    if (readable === false) {
      content = `<span class="empty">🔒 无法读取 —— 目标具有情报干扰性质</span>`;
    } else if (readable === 'overwhelming') {
      content = `<span class="empty">🌀 信息过载 —— 目标的意识过于庞大，无法解析</span>`;
    } else {
      content = `「${thought}」`;
    }

    thoughtContentEl.innerHTML = `
      <div style="font-weight:500;color:#b8b8e0;font-style:normal;margin-bottom:4px;">—— ${name}</div>
      ${content}
    `;
  }

  // ---- 发送低语者选择到酒馆 ----
  function sendWhisperSelect(target) {
    const msg = `[低语者] 正在倾听 ${target.name} 的心声...`;
    sendMessage(msg);
  }

  // ---- 发送消息到酒馆 ----
  function sendMessage(text) {
    if (window.parent && window.parent.postMessage) {
      window.parent.postMessage({ type: 'sendMessage', text: text }, '*');
    } else {
      const input = document.querySelector('textarea');
      if (input) {
        input.value = text;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        const btn = document.querySelector('button[type="submit"]');
        if (btn) btn.click();
      }
    }
  }

  // =============================================================
  //  接收酒馆消息
  // =============================================================
  function handleMessage(event) {
    const data = event.data;
    if (data.type === 'updateStory') {
      try {
        const parsed = typeof data.content === 'string' ? JSON.parse(data.content) : data.content;
        updateUI(parsed);
      } catch (_) {
        // 非JSON，保留当前状态不变（不影响界面）
        console.log('收到非结构化消息:', data.content);
      }
    }
  }

  window.addEventListener('message', handleMessage);

  // =============================================================
  //  导航切换
  // =============================================================
  navBtns.forEach(btn => {
    btn.addEventListener('click', function () {
      const page = this.dataset.page;
      // 更新按钮状态
      navBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      // 更新页面
      Object.keys(pages).forEach(key => {
        pages[key].classList.toggle('active', key === page);
      });

      const total = Object.keys(pages).length;
      const current = Object.keys(pages).indexOf(page) + 1;
      pageIndicator.textContent = current + ' / ' + total;
    });
  });

  // =============================================================
  //  扫描按钮
  // =============================================================
  document.getElementById('scanBtn').addEventListener('click', function () {
    sendMessage('[低语者] 扫描周围环境');
    this.textContent = '⏳ 扫描中...';
    setTimeout(() => { this.textContent = '⟳ 扫描'; }, 2000);
  });

  // =============================================================
  //  初始化
  // =============================================================
  // 加载演示数据（实际由AI更新）
  setTimeout(() => {
    updateUI({
      whispers: DEMO_WHISPERS,
      rValue: 1.002,
      rStatus: '安定',
      location: '太平洋 · 运输船',
      time: '午后',
      threat: '低',
      name: '言万心叶',
      age: 17,
      terminal: '低语者',
      stage: '4 · 活性化',
      status: '疲惫 · 警惕',
      weapon: 'noapusa（已损毁）',
      perception: '周围有 5 个生命信号，其中 1 个无法读取'
    });
  }, 300);

  // 暴露更新接口给外部
  window.__tscUpdate = updateUI;

  // 向酒馆请求初始内容
  setTimeout(() => {
    if (window.parent && window.parent.postMessage) {
      window.parent.postMessage({ type: 'requestFirstMessage' }, '*');
    }
  }, 500);
</script>
</body>
